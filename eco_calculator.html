<!DOCTYPE html>
<html>
<head>
  <title>Eco Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f9f1;
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #2e7d32;
    }
    label {
      display: block;
      margin-top: 15px;
    }
    input {
      padding: 8px;
      width: 100%;
      margin-top: 5px;
    }
    button {
      margin-top: 20px;
      padding: 10px;
      background: #388e3c;
      color: white;
      border: none;
      cursor: pointer;
      width: 100%;
    }
    .result {
      margin-top: 20px;
      padding: 10px;
      background: #dcedc8;
    }
  </style>
</head>
<body>

  <h1> Eco Calculator</h1>

  <label for="meat">1. Kilograms of meat consumed per week:</label>
  <input type="number" id="meat" />

  <label for="car">2. Kilometers driven by car per week:</label>
  <input type="number" id="car" />

  <label for="electricity">3. Electricity usage per month (kWh):</label>
  <input type="number" id="electricity" />

  <label for="water">4. Water usage per month (liters):</label>
  <input type="number" id="water" />

  <label for="recycle">5. Do you recycle regularly?</label>
  <select id="recycle">
    <option value="yes">Yes</option>
    <option value="no">No</option>
  </select>

  <button onclick="calculateImpact()">Submit</button>

  <div id="result" class="result"></div>

  <script>
    function calculateImpact() {
      const meat = parseFloat(document.getElementById('meat').value) || 0;
      const car = parseFloat(document.getElementById('car').value) || 0;
      const electricity = parseFloat(document.getElementById('electricity').value) || 0;
      const water = parseFloat(document.getElementById('water').value) || 0;
      const recycle = document.getElementById('recycle').value;

      const meatCO2 = meat * 10;
      const carCO2 = car * 0.21;
      const electricityCO2 = electricity * 0.92;
      const waterCO2 = water * 0.002;

      let total = meatCO2 + carCO2 + electricityCO2 + waterCO2;
      if (recycle === 'yes') total -= 5;

      total = Math.max(0, total);

      let feedback = '';
      if (total > 1000) {
        feedback = ' High impact detected. Consider reducing meat, driving, or energy usage.';
      } else if (total > 500) {
        feedback = ' Moderate impact. Not bad, but there\'s room to grow greener.';
      } else {
        feedback = ' Low impact! Keep up your eco-friendly lifestyle!';
      }

      document.getElementById('result').innerHTML =
        `<strong>Total Carbon Footprint:</strong> ${total.toFixed(2)} kg CO₂<br>${feedback}`;
    }
  </script>

</body>
</html>
